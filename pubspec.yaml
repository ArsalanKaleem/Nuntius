name: nuntius
description: Turn exported WhatsApp chats into interactive analytics and shareable Wrapped stories — entirely on-device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  lottie: ^3.1.2

  # Data / IO
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  csv: ^6.0.0
  collection: ^1.18.0
  intl: ^0.19.0

  # Export / share
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^9.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/sample/
    - assets/fonts/
    - assets/icon/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F7F5EF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
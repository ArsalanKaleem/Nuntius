name: nuntius
description: Turn exported WhatsApp chats into interactive analytics and shareable Wrapped stories — entirely on-device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  lottie: ^3.1.2

  # Data / IO
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  csv: ^6.0.0
  collection: ^1.18.0
  intl: ^0.19.0

  # Export / share
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^9.0.0

  # NOTE: two packages from the original brief were deliberately left out.
  #  * `repaint_boundary` is not a pub package — RepaintBoundary ships with
  #    Flutter, and lib/core/services/image_export_service.dart uses it directly.
  #  * `syncfusion_flutter_charts` requires a paid Syncfusion licence for
  #    commercial use. fl_chart covers every chart in this app. If you hold a
  #    licence, add it here and swap the widgets in features/dashboard/tabs.
  #  * `rive` is optional; add it if you ship .riv assets. Lottie is wired up.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample/
